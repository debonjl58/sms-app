// ============================================================
// build.gradle (RACINE)
// RÈGLE GRADLE : buildscript {} DOIT être le premier bloc.
// Les dépôts sont déclarés dans settings.gradle
// -> pas de bloc allprojects{} ici, ni de bloc plugins{}.
// ============================================================

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
